<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>霓虹竞技场 · 多人对战</title>
<meta name="description" content="在浏览器中与朋友进行最多六人的实时竞技对战。">
<link rel="stylesheet" href="/style.css">
<script src="/app.js" defer></script>
</head>
<body>
<div class="app">
<header>
<div class="brand">NEON ARENA<small>霓虹竞技场 · 20 杀获胜</small></div>
<div class="meta"><span id="room">尚未加入</span><span id="network">未连接</span><b id="clock">03:00</b><button id="copy" hidden>邀请朋友</button><button id="leave" hidden>离开房间</button></div>
</header>
<main>
<div>
<div class="stage">
<canvas id="arena" tabindex="0" width="1200" height="760" aria-label="对战竞技场"></canvas>
<div class="overlay" id="lobby">
<div class="panel">
<h1>霓虹竞技场</h1>
<p>最多 6 人同场。每局 3 分钟，率先取得 20 次击杀获胜；时间结束时击杀数最多者获胜。</p>
<label for="name">你的昵称</label>
<input id="name" maxlength="12" value="新玩家" autocomplete="nickname">
<button class="primary start" id="create">创建好友房</button>
<label for="code">加入朋友的房间</label>
<div class="join"><input id="code" maxlength="6" inputmode="numeric" placeholder="六位房间号" aria-label="六位房间号"><button class="start" id="join">加入</button></div>
<button class="start" id="training">单人练习 · 3 位 AI</button>
<div id="notice" role="status" aria-live="polite"></div>
</div>
</div>
</div>
<div class="touch">
<div class="pad"><button data-key="w" aria-label="向上">↑</button><button data-key="a" aria-label="向左">←</button><button data-key="s" aria-label="向下">↓</button><button data-key="d" aria-label="向右">→</button></div>
<div class="actions"><button data-key="dash">冲刺</button><button class="primary" data-key="fire">开火</button></div>
</div>
<div class="help desktop-help">WASD / 方向键移动 · 鼠标瞄准 · 按住鼠标左键 / 空格开火 · Shift 冲刺</div>
<div class="help mobile-help">方向键移动 · 自动瞄准最近的敌人 · 按住开火 · 冲刺躲避</div>
</div>
<aside>
<h2>本局排行 <span>击杀 / 阵亡</span></h2>
<div id="board"></div>
<div class="stat">生命 <b id="health">—</b></div>
<div class="stat">冲刺 <b id="dash">就绪</b></div>
<div id="feed"></div>
</aside>
</main>
</div>
</body>
</html>
